<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Md. Ariful Islam</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            background:#000;
            color:#fff;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            overflow:hidden;
        }

        .container{
            text-align:center;
            max-width:700px;
            padding:50px;
        }

        .check{
            width:110px;
            height:110px;
            margin:0 auto 30px;
            border-radius:50%;
            background:#ffbd39;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:55px;
            color:#000;
            box-shadow:0 0 40px rgba(255,189,57,.35);
        }

        h1{
            font-size:52px;
            font-weight:800;
            margin-bottom:20px;
        }

        h1 span{
            color:#ffbd39;
        }

        p{
            color:#bfbfbf;
            font-size:18px;
            line-height:1.8;
            margin-bottom:40px;
        }

        .btn{
            display:inline-block;
            background:#ffbd39;
            color:#000;
            text-decoration:none;
            padding:16px 40px;
            border-radius:50px;
            font-weight:700;
            transition:.3s;
        }

        .btn:hover{
            background:#fff;
            transform:translateY(-3px);
        }

        @media(max-width:768px){

            h1{
                font-size:38px;
            }

            p{
                font-size:16px;
            }

        }

    </style>

</head>
<body>

<div class="container">

    <div class="check">
        ✓
    </div>

    <h1>Thank <span>You!</span></h1>

    <p>
        Your message has been sent successfully.
        <br>
        Thank you for reaching out! I appreciate your interest and will get back to you as soon as possible.
    </p>

    <a href="index.html" class="btn">
        Back to Portfolio
    </a>

</div>

</body>
</html>
